name: Refresh data

on:
  schedule:
    - cron: '17 9 1 * *'      # 09:17 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      refetch_chains:
        description: 'Also re-download chain locations from OpenStreetMap (slow, ~40 min)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Drop cached chain locations (optional full refetch)
        if: ${{ inputs.refetch_chains }}
        run: rm -f data/pois.json

      - name: Pull all-network chargers, rematch chains, rebuild pages
        env:
          AFDC_API_KEY: ${{ secrets.AFDC_API_KEY }}
        run: |
          python3 data/fetch_chargers.py
          # POIs and highway geometry are committed caches; these only fill gaps
          [ -f data/pois.json ] && python3 data/fetch_pois.py || true
          [ -f data/highways.json ] && python3 data/fetch_highways.py || true
          python3 data/build_data.py
          python3 build.py --base https://chargeandchew.com

      - name: Verify the built site before publishing
        run: python3 verify.py

      - name: Smoke-test the app in a headless browser
        run: python3 verify_ui.py

      - name: Search parser regression tests
        run: python3 verify_search.py

      - name: Service worker tile-cache tests
        run: node sw_test.mjs

      - name: Opening-hours parser tests
        run: python3 verify_hours.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
            echo "pushed"
          else
            echo "no changes"
          fi
