<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:Inter,sans-serif;background:#0e1116;color:#eef1f5;
  display:flex;flex-direction:column;justify-content:center;padding:0 78px;position:relative;overflow:hidden}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-220px;border-radius:50%;
  background:radial-gradient(circle,rgba(22,163,74,.30),rgba(245,158,11,.16) 45%,transparent 70%)}
.mark{width:104px;height:104px;margin-bottom:26px;position:relative}
h1{font-size:66px;font-weight:900;letter-spacing:-2.4px;line-height:1.04;position:relative}
h1 .c{color:#4ade80}h1 .h{color:#fbbf24}h1 i{color:#6b7483;font-style:normal;margin:0 6px}
p{font-size:27px;color:#a2abb7;margin-top:18px;line-height:1.4;max-width:940px;position:relative}
.foot{position:absolute;bottom:46px;left:78px;font-size:21px;color:#6b7483;font-weight:600}
.pill{position:absolute;bottom:44px;right:78px;background:#1e222a;border:1px solid #2b313b;
  border-radius:100px;padding:11px 24px;font-size:19px;color:#a2abb7;font-weight:700}
</style></head><body>
<div class="glow"></div>
<div class="mark">
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="cc" x1="0" y1="0" x2="1" y2="0.35">
<stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
<mask id="ccm"><rect width="64" height="64" fill="#000"/><circle cx="32" cy="32" r="27" fill="#fff"/>
<path d="M34.5 9 L20 35.5 h9.5 l-2.5 19 L45 27 H34 z" fill="#000"/>
<circle cx="57" cy="17" r="8.5" fill="#000"/><circle cx="61" cy="29" r="7.5" fill="#000"/>
<circle cx="55" cy="40.5" r="6.5" fill="#000"/></mask></defs>
<g mask="url(#ccm)"><rect width="64" height="64" fill="url(#cc)"/></g></svg></div>
<h1><span class="c">Charge</span><i>&amp;</i><span class="h">Chew</span></h1>
<p>Fast EV chargers within a short walk of the places you actually want to stop.</p>
<div class="foot">chargeandchew.com</div>
<div class="pill">13,000+ chargers · 90 chains</div>
</body></html>
