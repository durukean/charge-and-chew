<!doctype html><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0d1117;color:#e6edf3;
font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#1a212b 1px,transparent 1px),linear-gradient(90deg,#1a212b 1px,transparent 1px);background-size:48px 48px;opacity:.5}
.wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column;justify-content:center}
h1{font-size:82px;font-weight:800;letter-spacing:-1px;line-height:1.05}
h1 .amp{color:#e82127}
.sub{font-size:34px;color:#8b949e;margin-top:22px;line-height:1.35;max-width:900px}
.chips{display:flex;gap:14px;margin-top:44px;flex-wrap:wrap}
.chip{font-size:30px;background:#161b22;border:1px solid #2b333d;border-radius:26px;padding:10px 22px}
.chip.on{background:#e82127;border-color:#e82127;color:#fff}
.url{position:absolute;bottom:56px;left:80px;font-size:30px;color:#e6edf3;font-weight:700}
.bolt{position:absolute;top:70px;right:90px;font-size:120px}
</style>
<div class="grid"></div>
<div class="wrap">
<div class="bolt">⚡</div>
<h1>Charge <span class="amp">&amp;</span> Chew</h1>
<div class="sub">Every US fast charger — all networks — within a short walk of the restaurants &amp; stores you actually want to stop at.</div>
<div class="chips"><span class="chip on">🥞 IHOP</span><span class="chip">🛒 Walmart</span><span class="chip">🦫 Buc-ee's</span><span class="chip on">☕ Starbucks</span></div>
</div>
<div class="url">chargeandchew.com</div>
