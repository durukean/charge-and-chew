name: ChargeAndChew
options:
  bundleIdPrefix: com.durukean
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T37B6B6S7K
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ChargeAndChew:
    type: application
    platform: iOS
    sources:
      - path: ChargeAndChew
        excludes:
          - "Web/**"
          - "Info.plist"
          - "*.entitlements"
      # Copied wholesale, unprocessed: index.html and data.js must reach the bundle byte for
      # byte, and letting Xcode "optimise" the web assets would silently rewrite them.
      - path: ChargeAndChew/Web
        type: folder
        buildPhase: resources
    # Every Info.plist key lives HERE, not in a hand-written file. `info.path` means
    # "generate this file", so xcodegen OVERWRITES whatever is at that path on every run --
    # a hand-edited plist silently lost its scene manifest, iOS made an empty window, and
    # the app launched to a black screen with no code running and nothing in the log.
    info:
      path: ChargeAndChew/Info.plist
      properties:
        # xcodegen writes literal "1" / "1.0" here unless told otherwise, so release.sh's
        # build-number bump never reached the binary and App Store Connect rejected build 2
        # as a duplicate of build 1. Route both through the build settings.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: "Charge & Chew"
        # Scenes are required for CarPlay. Delegate classes are assigned in code
        # (AppDelegate.configurationForConnecting), so no UISceneDelegateClassName here.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Charge & Chew uses your location to show the fast chargers nearest to you, and what you can walk to while you charge. Your location stays on your device."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.chargeandchew.app.deeplink
            CFBundleURLSchemes: [ccapp]
        # canOpenURL() answers "no" for any scheme not declared here, so without this the
        # Google Maps app would never be detected and everyone would get Apple Maps.
        LSApplicationQueriesSchemes:
          - comgooglemaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chargeandchew.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        # The CarPlay entitlement is not granted yet; a Release (device/TestFlight) build
        # carrying it would fail to sign. Debug = simulator, where it just works. Both files
        # carry the App Group the widget reads from.
        Debug:
          CODE_SIGN_ENTITLEMENTS: ChargeAndChew/CarPlay.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: ChargeAndChew/App.entitlements
    dependencies:
      - target: ChargeAndChewWidget
        embed: true

  ChargeAndChewWidget:
    type: app-extension
    platform: iOS
    # containerBackground (the only sane way to draw a widget) is iOS 17+. The app itself
    # stays at 16; iOS 16 users simply get no widget.
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes: ["Info.plist", "*.entitlements"]
      - path: ChargeAndChew/ChargerStore.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "Charge & Chew"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chargeandchew.app.widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
